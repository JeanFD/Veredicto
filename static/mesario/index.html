<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veredito · Mesário</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .sessao { display: flex; gap: 1rem; align-items: center; padding: 0.75rem;
              border: 1px solid #ccc; border-radius: 0.5rem; margin-bottom: 0.5rem; }
    .sessao.ativa { border-color: #2563eb; background: #eff6ff; }
    .sessao span { flex: 1; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    .grade { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .urna { padding: 0.75rem; border-radius: 0.5rem; border: 2px solid #ccc; }
    .online { border-color: #16a34a; } .offline { border-color: #dc2626; }
    .nunca { border-color: #a3a3a3; } .inativa { opacity: 0.4; }
    input { padding: 0.5rem; }
  </style>
</head>
<body>
  <section id="login">
    <h1>Veredito · Mesário</h1>
    <input id="senha" type="password" placeholder="Senha">
    <button id="entrar">Entrar</button>
    <p id="erro-login"></p>
  </section>

  <section id="painel" hidden>
    <h1>Painel do mesário</h1>
    <h2>Sessões</h2>
    <div id="sessoes"></div>
    <p>Sessão ativa: <strong id="ativa">nenhuma</strong> · Total: <strong id="total">0</strong></p>

    <h2>Urnas</h2>
    <div id="urnas" class="grade"></div>
  </section>

  <script src="mesario.js"></script>
</body>
</html>
