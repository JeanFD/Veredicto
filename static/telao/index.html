<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="telao.titulo">Veredito · Telão</title>
  <style>
    body { margin: 0; height: 100vh; background: radial-gradient(120% 80% at 50% 0%, #1d3557 0%, #0b1424 65%) #0b1424; color: #f8fafc; overflow: hidden;
           font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 2rem; text-align: center; }
    h1 { font-size: 3rem; max-width: 80%; margin: 0; letter-spacing: -0.01em; }
    .marca { position: fixed; top: 1.5rem; left: 2rem; display: flex; align-items: center; gap: 0.6rem;
             font-weight: 700; font-size: 1.25rem; letter-spacing: 0.04em; opacity: 0.6; }
    .marca svg { width: 1.6rem; height: 1.6rem; }
    /* colado ao tema, apesar do gap do body */
    #pergunta { font-size: 1.75rem; opacity: 0.7; margin: 0 0 -1.5rem; }
    #total { font-size: 12rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    #total.pulso { animation: pulso 0.6s ease-out; }
    #legenda { font-size: 2rem; opacity: 0.8; margin: 0.5rem 0 0; }
    #resultado { width: 80%; display: grid; gap: 1.5rem; }
    .barra { display: grid; grid-template-columns: 12rem 1fr 6rem; align-items: center;
             gap: 1rem; font-size: 2.5rem; }
    .barra strong { font-variant-numeric: tabular-nums; }
    .preenchimento { height: 4rem; border-radius: 0.5rem; width: 0;
                     transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
    [hidden] { display: none !important; }
    #regressiva { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                  font-size: 30rem; font-weight: 800; background: radial-gradient(120% 80% at 50% 0%, #1d3557 0%, #0b1424 65%) #0b1424; }
    #regressiva span { animation: batida 0.5s ease-out both; }
    .entrando { animation: entrada 0.6s ease-out both; }
    #celular { position: fixed; right: 2rem; bottom: 2rem; padding: 1rem; border-radius: 1rem;
               background: #fff; color: #0b1424; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45); }
    #celular p { margin: 0.5rem 0 0; font-size: 1.5rem; font-weight: bold; }
    #qr img, #qr canvas { display: block; }
    .faixa-teste { position: fixed; top: 0; left: 0; right: 0; padding: 0.6rem; font-size: 1.4rem; font-weight: 700;
                   letter-spacing: 0.05em; background: repeating-linear-gradient(-45deg, #b54708 0 18px, #93370d 18px 36px); }

    @keyframes pulso { from { transform: scale(1.08); color: #facc15; } to { transform: scale(1); } }
    @keyframes batida { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    /* só movimento, sem opacidade: se a animação não rodar, o resultado continua legível */
    @keyframes entrada { from { transform: translateY(2rem); } to { transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="faixa-teste" class="faixa-teste" hidden data-i18n="comum.faixa_teste">Sessão de teste · os votos serão apagados</div>
  <div class="marca" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg>
    Veredito
  </div>
  <p id="pergunta" hidden></p>
  <h1 id="tema" data-i18n="telao.aguardando">Aguardando</h1>
  <section id="contagem">
    <div id="total">0</div>
    <p id="legenda" data-i18n="telao.legenda.ABERTA">votos registrados</p>
  </section>
  <section id="resultado" hidden></section>
  <aside id="celular" hidden>
    <div id="qr"></div>
    <p data-i18n="telao.vote_celular">Vote pelo celular</p>
  </aside>
  <div id="regressiva" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/i18n.js?v=2"></script>
  <script src="telao.js?v=2"></script>
</body>
</html>
