<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veredito · Telão</title>
  <style>
    body { margin: 0; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden;
           font-family: system-ui, sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 2rem; text-align: center; }
    h1 { font-size: 3rem; max-width: 80%; margin: 0; }
    /* colado ao tema, apesar do gap do body */
    #pergunta { font-size: 1.75rem; opacity: 0.7; margin: 0 0 -1.5rem; }
    #total { font-size: 12rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    #total.pulso { animation: pulso 0.6s ease-out; }
    #legenda { font-size: 2rem; opacity: 0.8; margin: 0.5rem 0 0; }
    #resultado { width: 80%; display: grid; gap: 1.5rem; }
    .barra { display: grid; grid-template-columns: 12rem 1fr 6rem; align-items: center;
             gap: 1rem; font-size: 2.5rem; }
    .barra strong { font-variant-numeric: tabular-nums; }
    .preenchimento { height: 4rem; border-radius: 0.5rem; width: 0;
                     transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
    [hidden] { display: none !important; }
    #regressiva { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                  font-size: 30rem; font-weight: 800; background: #0f172a; }
    #regressiva span { animation: batida 0.5s ease-out both; }
    .entrando { animation: entrada 0.6s ease-out both; }
    #celular { position: fixed; right: 2rem; bottom: 2rem; padding: 1rem; border-radius: 1rem;
               background: #fff; color: #0f172a; text-align: center; }
    #celular p { margin: 0.5rem 0 0; font-size: 1.5rem; font-weight: bold; }
    #qr img, #qr canvas { display: block; }

    @keyframes pulso { from { transform: scale(1.08); color: #facc15; } to { transform: scale(1); } }
    @keyframes batida { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    /* só movimento, sem opacidade: se a animação não rodar, o resultado continua legível */
    @keyframes entrada { from { transform: translateY(2rem); } to { transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <p id="pergunta" hidden></p>
  <h1 id="tema">Aguardando</h1>
  <section id="contagem">
    <div id="total">0</div>
    <p id="legenda">votos registrados</p>
  </section>
  <section id="resultado" hidden></section>
  <aside id="celular" hidden>
    <div id="qr"></div>
    <p>Vote pelo celular</p>
  </aside>
  <div id="regressiva" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="telao.js"></script>
</body>
</html>
