<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="telao.titulo">Veredito · Telão</title>
  <style>
    /* Telão: preto, verde-limão e tipografia grande. Três tempos — cabeçalho com a
       situação da apuração, o palco no meio (pergunta, contagem ou cartões) e o
       rodapé com o total. A vencedora é o único bloco preenchido; o resto recua. */
    :root {
      --preto: #0b0c0a;
      --carvao: #17191b;
      --limao: #d7f24e;
      --texto: #f7f8f5;
      /* as quatro cores acima o admin troca no painel (telao.js põe aqui); o resto
         sai delas, para uma paleta nova não deixar tons do verde-limão para trás */
      --suave: color-mix(in srgb, var(--texto) 55%, transparent);
      --borda: color-mix(in srgb, var(--texto) 12%, transparent);
      --sobre-destaque: var(--preto);
      --margem: clamp(1.25rem, 3vw, 3rem);
      --qr: clamp(11rem, 15vw, 15rem);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--texto); overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(70% 50% at 50% 0%, color-mix(in srgb, var(--limao) 6%, var(--preto)) 0%, transparent 70%), var(--preto);
      display: grid; grid-template-rows: auto 1fr auto; gap: 1rem;
      padding: clamp(1rem, 2.2vw, 2rem) clamp(1.25rem, 3vw, 3rem);
    }

    /* cabeçalho e rodapé: as duas réguas que emolduram o palco */
    .topo, .rodape { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
                     font-size: clamp(0.65rem, 0.95vw, 0.85rem); font-weight: 700;
                     letter-spacing: 0.22em; text-transform: uppercase; }
    .topo { border-bottom: 1px solid var(--borda); padding-bottom: clamp(0.75rem, 1.5vw, 1.25rem); }
    /* a faixa de teste é fixa no topo: o cabeçalho desce para não ficar por baixo dela */
    #faixa-teste:not([hidden]) ~ .topo { margin-top: 2.9rem; }
    .rodape { border-top: 1px solid var(--borda); padding-top: clamp(0.75rem, 1.5vw, 1.25rem);
              color: var(--suave); }
    .rodape span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #rodape-total { color: var(--texto); }
    /* o tema só entra aqui quando o cartão cobre o palco */
    #rodape-tema { text-align: right; }
    .marca { display: flex; align-items: center; gap: 0.7rem; font-size: 1.15em; }
    .marca svg { width: 1.6em; height: 1.6em; }
    .topo .acoes { display: flex; align-items: center; gap: 0.75rem; }
    .topo .acoes button { padding: 0.45em 0.9em; border-radius: 999px; border: 1px solid var(--borda);
                          background: transparent; color: var(--suave); font: inherit; cursor: pointer; }
    .topo .acoes button:hover, .topo .acoes button:focus-visible { color: var(--texto); border-color: var(--texto); }
    .pilula { padding: 0.45em 1.1em; border: 1px solid var(--limao); border-radius: 999px;
              color: var(--limao); white-space: nowrap; }
    #situacao.apurado { background: var(--limao); color: var(--sobre-destaque); }
    /* a sala inteira olha para cá: a queda da conexão não pode passar em silêncio */
    .pilula.alerta { border-color: #f97066; color: #f97066; animation: pisca 1.6s ease-in-out infinite; }
    @keyframes pisca { 50% { opacity: 0.35; } }

    /* palco */
    .palco { display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: clamp(0.75rem, 1.6vh, 1.5rem); text-align: center; min-height: 0; }
    #caso { margin: 0; color: var(--limao); font-size: clamp(0.7rem, 1.1vw, 1rem); font-weight: 700;
            letter-spacing: 0.26em; text-transform: uppercase; }
    #pergunta { margin: 0; color: var(--suave); font-size: clamp(0.85rem, 1.3vw, 1.2rem);
                letter-spacing: 0.1em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 24ch; font-size: clamp(2rem, 4.6vw, 4.4rem); font-weight: 800;
         line-height: 1.04; letter-spacing: -0.035em; text-wrap: balance; }

    #total { font-size: clamp(6rem, 15vw, 14rem); font-weight: 800; line-height: 0.9;
             letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
    #total.pulso { animation: pulso 0.6s ease-out; }
    #legenda { margin: 0.5rem 0 0; color: var(--suave); font-size: clamp(0.75rem, 1.1vw, 1rem);
               letter-spacing: 0.22em; text-transform: uppercase; }

    /* cartões do resultado: um por opção, a vencedora preenchida */
    /* a largura de cada cartão acompanha a porcentagem: a frente ocupa mais tela */
    #resultado { width: 100%; margin-top: clamp(0.5rem, 2.5vh, 2rem); display: flex; flex-wrap: wrap;
                 align-items: stretch; gap: clamp(0.75rem, 1.4vw, 1.25rem); }
    /* largura proporcional à fatia (o script mexe no flex-grow), com um mínimo para
       o texto não quebrar */
    .opcao { position: relative; overflow: hidden; display: grid; align-content: start;
             container-type: inline-size;
             flex: 1 1 0; min-width: clamp(9rem, 13vw, 15rem);
             transition: background-color 0.5s ease, color 0.5s ease;
             gap: clamp(0.5rem, 1.2vh, 1rem); padding: clamp(1rem, 1.8vw, 1.9rem);
             border-radius: clamp(1rem, 1.6vw, 1.75rem); background: var(--carvao); text-align: left;
             animation: cartao-entra 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .opcao.vencedora { background: var(--limao); color: var(--sobre-destaque); }
    .opcao .cabeca { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
                     font-size: clamp(0.6rem, 0.85vw, 0.8rem); font-weight: 700; letter-spacing: 0.2em;
                     text-transform: uppercase; color: var(--suave); min-height: 2em; }
    .opcao.vencedora .cabeca { color: color-mix(in srgb, var(--sobre-destaque) 65%, transparent); }
    .selo-vencedora { padding: 0.5em 1.1em; border-radius: 999px; background: var(--sobre-destaque);
                      color: var(--limao); white-space: nowrap;
                      animation: selo-entra 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    /* o cartão da perdedora encolhe com a porcentagem e o rótulo ia junto, picado em
       pedaços de três letras: no cartão estreito a letra diminui, e o corte em três
       linhas é o limite para um rótulo comprido não empurrar os números para fora */
    .rotulo { margin: 0; font-size: clamp(1.2rem, 2.1vw, 2.1rem); font-weight: 600; line-height: 1.15;
              letter-spacing: -0.01em; overflow-wrap: anywhere;
              display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
              overflow: hidden; }
    @container (max-width: 20rem) {
      .rotulo { font-size: clamp(0.9rem, 7cqi, 1.5rem); }
      .porcento { font-size: clamp(2rem, 22cqi, 4rem); }
    }
    .numeros { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
               flex-wrap: wrap; }
    .porcento { font-size: clamp(3rem, 7.5vw, 7rem); font-weight: 800; line-height: 0.85;
                letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
    .porcento .sinal { font-size: 0.4em; font-weight: 700; letter-spacing: 0; }
    .pontos { font-size: clamp(0.8rem, 1.2vw, 1.1rem); color: var(--suave); white-space: nowrap; }
    .opcao.vencedora .pontos { color: color-mix(in srgb, var(--sobre-destaque) 70%, transparent); }
    body.sem-votos .opcao .pontos { display: none; }
    .trilho { height: clamp(0.4rem, 0.8vh, 0.6rem); border-radius: 999px;
              background: var(--borda); }
    .opcao.vencedora .trilho { background: color-mix(in srgb, var(--sobre-destaque) 18%, transparent); }
    .preenchimento { width: 0; height: 100%; border-radius: 999px; background: var(--limao);
                     transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.45s; }
    .opcao.vencedora .preenchimento { background: var(--sobre-destaque); }
    .legenda-opcao { font-size: clamp(0.58rem, 0.8vw, 0.72rem); font-weight: 700; letter-spacing: 0.2em;
                     text-transform: uppercase; color: var(--suave); }
    .opcao.vencedora .legenda-opcao { color: color-mix(in srgb, var(--sobre-destaque) 60%, transparent); }
    /* um brilho passa uma vez pela vencedora, logo depois da barra encher */
    .opcao.vencedora.apurada::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%;
                                      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
                                      animation: brilho 1.5s ease-out 0.3s both; }
    /* com muitas opções os números encolhem para caber sem rolagem */
    #resultado.muitas .porcento { font-size: clamp(2rem, 4vw, 3.4rem); }
    #resultado.muitas .rotulo { font-size: clamp(1rem, 1.5vw, 1.4rem); }

    /* cartão de conteúdo: pano de fundo do caso, notícia ou laudo */
    /* O texto encolhe até o cartão caber inteiro (--escala, posta pelo telao.js): uma
       frase cortada no meio é pior do que uma letra um pouco menor. As medidas vão em
       em, para as entrelinhas acompanharem a letra. */
    #cartao { position: relative; width: min(1200px, 100%); max-height: 68vh; overflow: hidden;
              text-align: left; }
    /* com o QR na tela, o texto não invade a coluna dele; a caixa do cartão é transparente,
       então reservar essa faixa não aparece */
    body.com-qr #cartao { padding-right: calc(var(--qr) + var(--margem)); }
    #cartao h2 { margin: 0 0 0.6em; text-align: center; letter-spacing: -0.02em;
                 font-size: calc(clamp(1.6rem, 3.2vw, 2.9rem) * var(--escala, 1)); }
    /* cartão só com título: a mesma letra do tema da sessão, no meio do palco */
    #cartao.so-titulo { text-align: center; }
    /* o padding guarda as descendentes (g, ç, p): com a entrelinha justa elas passavam
       da caixa, e o ajuste do cartão lia isso como texto que não cabe e encolhia tudo */
    #cartao.so-titulo h2 { margin: 0 auto; padding: 0.06em 0 0.14em; max-width: 24ch; font-weight: 800; line-height: 1.04;
                           letter-spacing: -0.035em; text-wrap: balance;
                           font-size: calc(clamp(2rem, 4.6vw, 4.4rem) * var(--escala, 1)); }
    #cartao.so-titulo #cartao-texto { display: none; }
    #cartao-texto { font-size: calc(clamp(1rem, 1.75vw, 1.75rem) * var(--escala, 1)); line-height: 1.5; }
    #cartao-texto p { margin: 0 0 1em; }
    #cartao-texto ul { margin: 0 0 1em; padding-left: 1.5em; }
    #cartao-texto li { margin-bottom: 0.5em; }
    #cartao-fonte { margin: 1.25em 0 0; text-align: right; color: var(--suave);
                    font-size: calc(0.95rem * var(--escala, 1)); }
    /* longo até no menor tamanho: a sala precisa saber que o texto continua */
    #cartao.cortado::after { content: "…"; position: absolute; right: 0; bottom: 0; left: 0;
                             padding: 2.5rem 0 0; text-align: center; font-size: 2rem; font-weight: 800;
                             color: var(--suave);
                             background: linear-gradient(transparent, var(--preto) 70%); }
    body.com-cartao #pergunta, body.com-cartao #tema,
    body.com-cartao #contagem, body.com-cartao #resultado { display: none !important; }

    /* cronômetro das falas */
    /* abaixo da régua do cabeçalho, para não cobrir a marca nem a situação */
    #cronometro { position: fixed; top: clamp(3.75rem, 8vh, 5.5rem); left: 50%; transform: translateX(-50%);
                  z-index: 3; padding: 0.6rem 1.8rem; border-radius: 1.1rem; text-align: center;
                  background: rgba(23, 25, 27, 0.92); border: 1px solid var(--borda);
                  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6); }
    #faixa-teste:not([hidden]) ~ #cronometro { top: clamp(5.5rem, 11vh, 7.5rem); }
    #cronometro-titulo { margin: 0; color: var(--suave); font-size: 1.1rem; font-weight: 700;
                         letter-spacing: 0.12em; text-transform: uppercase; }
    #cronometro-tempo { font-size: 4.2rem; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em;
                        font-variant-numeric: tabular-nums; }
    #cronometro-esgotado { margin: 0 0 0.2rem; font-size: 1rem; font-weight: 700; letter-spacing: 0.12em;
                           text-transform: uppercase; }
    #cronometro.esgotado { background: #7f1d1d; border-color: #dc2626; animation: alerta 1.4s ease-in-out infinite; }

    /* QR do voto por celular */
    #celular { position: fixed; right: var(--margem); bottom: clamp(3.5rem, 7vh, 5.5rem);
               z-index: 2; width: var(--qr); padding: 1rem 1rem 0.8rem; border-radius: 1.25rem;
               background: #fff; color: var(--preto); text-align: center;
               box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); }
    #celular p { margin: 0.6rem 0 0; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.1em;
                 text-transform: uppercase; }
    #qr img, #qr canvas { display: block; width: 100%; height: auto; }

    .faixa-teste { position: fixed; top: 0; left: 0; right: 0; z-index: 4; padding: 0.6rem;
                   font-size: 1.3rem; font-weight: 700; letter-spacing: 0.1em; text-align: center;
                   text-transform: uppercase;
                   background: repeating-linear-gradient(-45deg, #b54708 0 18px, #93370d 18px 36px); }

    #regressiva { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center;
                  justify-content: center; background: var(--preto); color: var(--limao);
                  font-size: 32rem; font-weight: 800; letter-spacing: -0.06em; }
    /* o número aparece inteiro no instante do bipe e só dá um pulso: antes entrava
       transparente e só assentava meio segundo depois, e o som parecia adiantado */
    #regressiva span { animation: batida 0.35s ease-out both; }
    .entrando { animation: surgir 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
    [hidden] { display: none !important; }

    @keyframes surgir { from { opacity: 0; transform: translateY(1.2rem); } to { opacity: 1; transform: none; } }
    @keyframes cartao-entra { from { opacity: 0; transform: translateY(2.5rem) scale(0.97); }
                              to { opacity: 1; transform: none; } }
    @keyframes selo-entra { 0% { opacity: 0; transform: scale(0.4) rotate(-8deg); }
                            70% { opacity: 1; transform: scale(1.08) rotate(0); }
                            100% { opacity: 1; transform: scale(1); } }
    @keyframes brilho { from { transform: translateX(-120%) skewX(-14deg); }
                        to { transform: translateX(260%) skewX(-14deg); } }
    @keyframes pulso { from { transform: scale(1.06); color: var(--limao); } to { transform: scale(1); } }
    @keyframes batida { from { transform: scale(1.18); } to { transform: scale(1); } }
    @keyframes alerta { 50% { background: #dc2626; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .opcao.vencedora.apurada::after { display: none; }
    }
  </style>
</head>
<body>
  <div id="faixa-teste" class="faixa-teste" hidden data-i18n="comum.faixa_teste">Sessão de teste · os votos serão apagados</div>

  <header class="topo">
    <div class="marca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg>
      Veredito
    </div>
    <div class="acoes">
      <button type="button" id="tela-cheia" data-i18n="telao.tela_cheia">tela cheia</button>
      <button type="button" id="ligar-som" hidden data-i18n="telao.ligar_som">ligar o som</button>
      <span id="sem-rede" class="pilula alerta" hidden data-i18n="telao.sem_rede">sem conexão</span>
      <span id="situacao" class="pilula"></span>
    </div>
  </header>

  <main class="palco">
    <p id="caso" hidden></p>
    <p id="pergunta" hidden></p>
    <h1 id="tema" data-i18n="telao.aguardando">Aguardando</h1>
    <section id="contagem">
      <div id="total">0</div>
      <p id="legenda" data-i18n="telao.legenda.ABERTA">votos registrados</p>
    </section>
    <section id="resultado" hidden></section>
    <section id="cartao" hidden>
      <h2 id="cartao-titulo"></h2>
      <div id="cartao-texto"></div>
      <p id="cartao-fonte" hidden></p>
    </section>
  </main>

  <footer class="rodape">
    <span id="rodape-total"></span>
    <span id="rodape-tema"></span>
  </footer>

  <div id="cronometro" hidden>
    <p id="cronometro-titulo"></p>
    <div id="cronometro-tempo">0:00</div>
    <p id="cronometro-esgotado" hidden data-i18n="telao.tempo_esgotado">tempo esgotado</p>
  </div>

  <aside id="celular" hidden>
    <div id="qr"></div>
    <p id="texto-celular" data-i18n="telao.vote_celular">Vote pelo celular</p>
  </aside>

  <div id="regressiva" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/i18n.js?v=2"></script>
  <script src="/sons.js?v=3"></script>
  <script src="/cores.js?v=2"></script>
  <script src="telao.js?v=9"></script>
</body>
</html>
