services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [web]

  veredicto:
    build: .
    container_name: veredicto
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks: [web]
    mem_limit: 512m
    cpus: 1.0

  # opcional: só sobe com --profile escala (ver deploy/ESCALA.md)
  redis:
    image: redis:7.4-alpine
    container_name: veredicto-redis
    restart: unless-stopped
    profiles: [escala]
    # só pub/sub e estado efêmero: sem persistência em disco, memória limitada
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb"]
    networks: [web]
    mem_limit: 64m

networks:
  web:
    name: web

volumes:
  caddy_data:
  caddy_config:
