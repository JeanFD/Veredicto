name: Deploy

on:
  workflow_run:
    workflows: ["Testes"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          script: |
            set -e
            cd /opt/veredicto
            git pull --ff-only
            docker compose build veredicto
            # backup + migrações antes de trocar o container: se falharem, o
            # set -e para o deploy aqui e a versão antiga continua no ar
            docker compose run --rm --no-deps veredicto python -m app.migrar
            docker compose up -d veredicto
            sleep 5
            docker compose ps veredicto | grep -q "Up" || exit 1
            docker image prune -f
